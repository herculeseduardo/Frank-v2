<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frank — Defesa Orbital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
  </head>
  <body>
    <div id="welcome-screen">
      <p class="eyebrow">Defesa orbital // Setor 7</p>
      <h1>FRANK</h1>
      <p class="tagline">Pilote. Atire. Sobreviva.</p>
      <input type="text" id="nickname-input" placeholder="Digite seu nickname" maxlength="15" autocomplete="off">
      <div class="button-container">
        <button id="start-button" class="game-button">Começar jogo</button>
        <button id="show-ranking-button" class="game-button">Ver ranking</button>
      </div>
    </div>

    <div id="hud">
      <div class="hud-panel">
        <span class="hud-label">Pontuação</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-panel" id="power-panel">
        <span class="hud-label">Bomba nuclear</span>
        <div id="power-container" data-state="low"><div id="power-bar"></div></div>
        <span id="atomic-text">Abata inimigos para carregar</span>
      </div>
    </div>

    <div id="instructions">
      <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> mover</span>
      <span><kbd>Z</kbd> atirar</span>
      <span><kbd>X</kbd> bomba nuclear</span>
    </div>

    <div id="ranking-modal">
      <div id="ranking-list">
        <h2>Hall da Fama</h2>
        <div id="ranking-items"></div>
      </div>
      <div class="ranking-buttons">
        <button id="close-ranking">Fechar</button>
        <button id="play-again">Jogar</button>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="./static/js/Frank.js"></script>
    <script src="./static/js/game.js"></script>
    <script src="./static/js/ranking.js"></script>
    <script>
      // Carregar o último nickname salvo
      document.addEventListener('DOMContentLoaded', () => {
        const nicknameInput = document.getElementById('nickname-input');
        const lastNickname = localStorage.getItem('lastNickname');
        if (lastNickname) {
          nicknameInput.value = lastNickname;
        }

        // Salvar o nickname quando o usuário começar o jogo
        document.getElementById('start-button').addEventListener('click', () => {
          const nickname = nicknameInput.value.trim();
          if (nickname) {
            localStorage.setItem('lastNickname', nickname);
          }
        });
      });

      // Adicionar evento para o botão de jogar novamente
      document.getElementById('play-again').addEventListener('click', () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
